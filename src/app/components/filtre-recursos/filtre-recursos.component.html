<form class="formulari-filtre" (ngSubmit)="onAplicar()">
  <div class="camp">
    <label for="cerca">Text de cerca:</label>
    <input
      id="cerca"
      name="textCerca"
      type="text"
      [(ngModel)]="textCerca"
      required
      minlength="3"
      placeholder="Mínim 3 caràcters..."
    />
    @if (textInvalid) {
      <p class="missatge-error" role="alert">
        El text ha de tenir com a mínim 3 caràcters.
      </p>
    }
  </div>

  <div class="camp">
    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria" [(ngModel)]="categoriaSeleccionada">
      <option value="">Totes les categories</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="textInvalid">
      Aplicar
    </button>
    <button type="button" (click)="onRestablir()">
      Restablir
    </button>
  </div>
</form>
